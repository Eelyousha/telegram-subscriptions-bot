version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: subscriptions
      POSTGRES_USER: subscriptions_user
      POSTGRES_PASSWORD: subscriptions_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subscriptions_user -d subscriptions"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+asyncpg://subscriptions_user:subscriptions_pass@db:5432/subscriptions
      BOT_TOKEN: ${BOT_TOKEN}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      NOTIFICATION_HOUR: ${NOTIFICATION_HOUR:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  bot:
    build:
      context: ..
      dockerfile: Dockerfile.bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      API_URL: http://api:8000
      DATABASE_URL: postgresql+asyncpg://subscriptions_user:subscriptions_pass@db:5432/subscriptions
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      THROTTLE_RATE: ${THROTTLE_RATE:-30}
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
